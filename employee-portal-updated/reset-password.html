<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slaptažodžio keitimas</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-wrap">
        <img src="logo.png" alt="Logo" class="logo" />
        <div>
          <h1>Darbuotojų portalas</h1>
          <p>Slaptažodžio keitimas</p>
        </div>
      </div>

      <div id="msgBox" style="display:none; padding:12px 16px; border-radius:10px; font-size:14px; margin-bottom:16px;"></div>

      <div id="formWrap">
        <div class="form-group">
          <label for="newPassword">Naujas slaptažodis</label>
          <input type="password" id="newPassword" placeholder="Įveskite naują slaptažodį" minlength="6" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Pakartokite slaptažodį</label>
          <input type="password" id="confirmPassword" placeholder="Pakartokite slaptažodį" minlength="6" />
        </div>
        <button id="resetBtn" class="btn-login">Keisti slaptažodį</button>
      </div>

      <div style="text-align:center; margin-top:16px;">
        <a href="/" style="font-size:13px; color:#94a3b8; text-decoration:none;">← Grįžti į prisijungimą</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      showMsg('Neteisinga arba pasibaigusi nuoroda. Bandykite iš naujo.', 'error');
      document.getElementById('formWrap').style.display = 'none';
    }

    document.getElementById('resetBtn')?.addEventListener('click', async () => {
      const pw  = document.getElementById('newPassword').value;
      const pw2 = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('resetBtn');

      if (!pw || pw.length < 6) { showMsg('Slaptažodis turi būti bent 6 simbolių', 'error'); return; }
      if (pw !== pw2) { showMsg('Slaptažodžiai nesutampa', 'error'); return; }

      btn.disabled = true; btn.textContent = 'Keičiama...';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw })
        });
        const data = await res.json();
        if (res.ok) {
          showMsg('✅ Slaptažodis sėkmingai pakeistas! Galite prisijungti.', 'success');
          document.getElementById('formWrap').style.display = 'none';
          setTimeout(() => window.location.href = '/', 2500);
        } else {
          showMsg(data.error || 'Klaida keičiant slaptažodį', 'error');
          btn.disabled = false; btn.textContent = 'Keisti slaptažodį';
        }
      } catch (err) {
        showMsg('Serverio klaida', 'error');
        btn.disabled = false; btn.textContent = 'Keisti slaptažodį';
      }
    });

    function showMsg(msg, type) {
      const el = document.getElementById('msgBox');
      el.textContent = msg;
      el.style.display = 'block';
      el.style.background = type === 'success' ? '#f0fdf4' : '#fef2f2';
      el.style.border    = `1px solid ${type === 'success' ? '#bbf7d0' : '#fecaca'}`;
      el.style.color     = type === 'success' ? '#166534' : '#dc2626';
    }
  </script>
</body>
</html>
